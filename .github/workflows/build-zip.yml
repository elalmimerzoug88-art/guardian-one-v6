name: Build APK from ZIP

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find and extract ZIP file
        run: |
          # ابحث عن أي ملف zip في المستودع وفكه
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Found zip file: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted_project
          
          # نقل الملفات المرفوعة إلى المجلد الرئيسي للمشروع ليتمكن غريدل من قراءتها
          # (في حال كان الملف المضغوط يحتوي بداخله على مجلد المشروع)
          cd extracted_project
          EXTRACTED_SUBFOLDER=$(ls -d */ | head -n 1)
          cd "$EXTRACTED_SUBFOLDER"
          cp -r . ../../
          cd ../..

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
